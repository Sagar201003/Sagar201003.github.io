<body class="blog-theme">

    <nav id="navbar" class="navbar">
        <div class="nav-container">

                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
            </div>
        </div>
    </nav>

    <!-- Animated neural network background -->
    <canvas id="neural-bg"></canvas>

    <div class="blog-page-wrapper">
        <div class="projects-header-container">
            <h1 class="projects-page-title">My <span>Blog</span></h1>
            <p class="projects-page-desc">Thoughts, tutorials, and insights on AI, Machine Learning, and Software Engineering.</p>
        </div>

        <div class="projects-controls">
            <div class="filter-bar" id="blog-filters">
                <button class="filter-pill active" data-filter="all">All</button>
                <button class="filter-pill" data-filter="cv">Computer Vision</button>
                <button class="filter-pill" data-filter="mlops">MLOps</button>
                <button class="filter-pill" data-filter="llm">LLMs</button>
                <button class="filter-pill" data-filter="research">Research</button>
            </div>
            
            <div class="search-bar">
                <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                <input type="text" id="blog-search" placeholder="Search articles...">
            </div>
        </div>

        <div class="container" style="max-width: 1100px;">
            <!-- Featured Article Hero Card -->
            <div id="featured-article-container">
                <!-- Dynamically populated by JS -->
            </div>

            <!-- Blog Grid -->
            <div class="blog-grid" id="blog-grid-container">
                <!-- Dynamically populated by JS -->
                <div style="text-align: center; grid-column: 1 / -1; padding: 2rem; color: #94a3b8;">
                    Loading articles from Hashnode...
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer">

        <div class="footer-content">
